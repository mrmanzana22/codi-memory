name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Repo hygiene check
        run: python scripts/check_repo_hygiene.py

      - name: Run tests
        env:
          CODI_SKIP_QDRANT: "1"
        run: |
          python -m pytest tests/ -v --tb=short -x \
            --ignore=tests/test_task_battery.py \
            --ignore=tests/test_task_battery_ablations.py \
            --ignore=tests/test_continuity_battery.py \
            --ignore=tests/test_continuity_ablations.py \
            --ignore=tests/parity/

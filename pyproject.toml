[project]
name = "codi-memory"
version = "1.0.0"
description = "MCP memory server with cognitive architecture for Codi AI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "battery: Task Battery cognitive integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyiceberg.*",
    "ignore::DeprecationWarning:backoff.*",
]

[tool.bandit]
# Exclude test files and virtual environments
exclude_dirs = ["tests", "venv", "claude-code-server"]

# Skip low-confidence findings and known safe patterns
skips = [
    "B101",  # assert used (fine in non-web code)
    "B311",  # random not for crypto (uuid4 is fine)
    "B603",  # subprocess without shell=True (safe)
    "B607",  # partial executable path (safe in controlled env)
]
